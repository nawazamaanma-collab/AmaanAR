<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amaan Palm AR</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #video, #canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #video {
            transform: scaleX(-1);
        }

        #canvas {
            pointer-events: none;
        }

        #status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,.6);
            padding: 10px 16px;
            border-radius: 20px;
            z-index: 10;
            font-family: Arial;
        }
    </style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="status">Starting camera...</div>

<script type="module">
import {
    HandLandmarker,
    FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
);

const handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
        modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 1
});

const stream = await navigator.mediaDevices.getUserMedia({
    video: {
        facingMode: "user",
        width: { ideal: 1280 },
        height: { ideal: 720 }
    },
    audio: false
});

video.srcObject = stream;

video.addEventListener("loadeddata", () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    status.textContent = "Show your palm ✋";
    detectHands();
});

function detectHands() {

    const results = handLandmarker.detectForVideo(
        video,
        performance.now()
    );

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (results.landmarks.length > 0) {

        const hand = results.landmarks[0];

        // Palm center
        const points = [
            hand[0],
            hand[5],
            hand[9],
            hand[13],
            hand[17]
        ];

        let x = 0;
        let y = 0;

        for (const p of points) {
            x += p.x;
            y += p.y;
        }

        x = (x / points.length) * canvas.width;
        y = (y / points.length) * canvas.height;

        // Mirror position for front camera
        x = canvas.width - x;

        // Red AR cube
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(performance.now() / 700);

        ctx.fillStyle = "red";
        ctx.fillRect(-45, -45, 90, 90);

        ctx.strokeStyle = "white";
        ctx.lineWidth = 5;
        ctx.strokeRect(-45, -45, 90, 90);

        ctx.restore();

        status.textContent = "Palm detected ✋";
    }

    requestAnimationFrame(detectHands);
}
</script>

</body>
</html>
